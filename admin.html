<script>
    const FIREBASE_DB_URL = "https://data-scrapper-eddcf-default-rtdb.firebaseio.com/";
    let currentClient = localStorage.getItem("dl_logged_client") || "Gslogisticsdispatch";
    let activeTab = 'online';
    let cachedSessions = {}, cachedReports = {}, cachedCallLogs = {};

    async function fetchAdminData() {
        try {
            let [sRes, rRes, cRes] = await Promise.all([
                fetch(`${FIREBASE_DB_URL}sessions/${currentClient}.json`),
                fetch(`${FIREBASE_DB_URL}shift_reports/${currentClient}.json`),
                fetch(`${FIREBASE_DB_URL}call_logs/${currentClient}.json`)
            ]);
            cachedSessions = await sRes.json() || {};
            cachedReports = await rRes.json() || {};
            cachedCallLogs = await cRes.json() || {};
            renderContent();
        } catch (e) {
            document.getElementById('adminBodyContent').innerHTML = `<p style="color: red; text-align: center; padding: 20px;">Failed to load data from Firebase.</p>`;
        }
    }

    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.admin-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        
        document.getElementById('exportBtn').style.display = tab === 'online' ? 'none' : 'block';
        renderContent();
    }

    function renderContent() {
        let container = document.getElementById('adminBodyContent');
        let now = Date.now();

        if (activeTab === 'online') {
            let html = `<div style="display: flex; flex-direction: column; gap: 12px;">`;
            let users = new Set();
            Object.values(cachedSessions).forEach(s => s?.nickname && users.add(s.nickname));
            Object.keys(cachedReports).forEach(n => users.add(n));
            Object.keys(cachedCallLogs).forEach(n => users.add(n));

            if (users.size === 0) {
                container.innerHTML = `<p style="color: #64748b; text-align: center; padding: 40px; font-style: italic;">No active users or agents found.</p>`;
                return;
            }

            users.forEach(name => {
                let sObj = Object.values(cachedSessions).find(s => s?.nickname === name);
                let isOnline = sObj && (now - sObj.timestamp < 60000);
                let badge = isOnline ? `<span style="background:#dcfce7; color:#15803d; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600;">🟢 Online</span>` : `<span style="background:#f1f5f9; color:#64748b; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600;">⚪ Offline</span>`;
                
                html += `
                    <div class="card">
                        <div>
                            <b style="font-size: 15px; color: #0f172a;">${name}</b> ${badge}
                            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Login Time: ${sObj?.loginTime || 'N/A'}</div>
                        </div>
                        <div style="font-size: 12px; color: #475569; background: #f8fafc; padding: 6px 10px; border-radius: 6px; border: 1px solid #e2e8f0;">Last Active: ${sObj?.timestamp ? new Date(sObj.timestamp).toLocaleTimeString() : 'Never'}</div>
                    </div>`;
            });
            container.innerHTML = html + `</div>`;

        } else if (activeTab === 'leaderboard') {
            let perfMap = {};
            let allUsers = new Set();
            Object.keys(cachedCallLogs).forEach(n => allUsers.add(n));
            Object.keys(cachedReports).forEach(n => allUsers.add(n));

            allUsers.forEach(name => {
                let logs = cachedCallLogs[name];
                let totalCalls = Array.isArray(logs) ? logs.length : 0;
                if (totalCalls === 0 && cachedReports[name]) {
                    totalCalls = cachedReports[name].reduce((sum, r) => sum + (r.totalCalls || 0), 0);
                }
                if (totalCalls > 0) {
                    perfMap[name] = totalCalls;
                }
            });

            let sorted = Object.keys(perfMap).sort((a, b) => perfMap[b] - perfMap[a]);
            if (sorted.length === 0) {
                container.innerHTML = `<p style="color: #64748b; text-align: center; padding: 40px; font-style: italic;">No calling activity or leaderboard entries found.</p>`;
                return;
            }

            let html = `<div style="display: flex; flex-direction: column; gap: 12px;">`;
            sorted.forEach((name, idx) => {
                let medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx+1}`;
                html += `
                    <div class="card" style="border-left: 4px solid #3b82f6;">
                        <div style="display: flex; align-items: center; gap: 14px;">
                            <span style="font-size: 18px; font-weight: 700; width: 30px; text-align: center;">${medal}</span>
                            <div>
                                <b style="font-size: 15px; color: #0f172a;">${name}</b>
                                <div style="font-size: 12px; color: #64748b; margin-top: 2px;">Active Calling Performance</div>
                            </div>
                        </div>
                        <div style="background: #0f172a; color: white; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;">
                            Total Calls: ${perfMap[name]}
                        </div>
                    </div>`;
            });
            container.innerHTML = html + `</div>`;

        } else if (activeTab === 'reports') {
            let html = `<div style="display: flex; flex-direction: column; gap: 12px;">`;
            let hasReports = false;

            Object.keys(cachedReports).forEach(name => {
                let reps = cachedReports[name];
                if (Array.isArray(reps) && reps.length > 0) {
                    hasReports = true;
                    reps.forEach(rep => {
                        html += `
                            <div class="card" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                                <div style="display: flex; justify-content: space-between; width: 100%;">
                                    <b style="color: #0f172a; font-size: 15px;">👤 Agent: ${name}</b>
                                    <span style="font-size: 12px; color: #64748b;">Date: ${rep.date} (${rep.timestamp})</span>
                                </div>
                                <div style="font-size: 13px; color: #334155;">
                                    <b>Total Calls Logged:</b> ${rep.totalCalls || 0}
                                </div>
                            </div>`;
                    });
                }
            });

            if (!hasReports) {
                container.innerHTML = `<p style="color: #64748b; text-align: center; padding: 40px; font-style: italic;">No shift reports submitted by agents yet.</p>`;
                return;
            }
            container.innerHTML = html + `</div>`;
        }
    }

    function exportCSV() {
        alert("Exporting CSV report...");
    }

    fetchAdminData();
</script>
