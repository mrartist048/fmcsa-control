<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Dispatch Link</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root{--bg:#070d1c;--card:#0f1830;--line:#1e2a47;--ink:#eef2ff;--mut:#8b97b5;--a1:#4f7cff;--a2:#7c4dff}
  @media (prefers-color-scheme: light){:root{--bg:#eef2f9;--card:#ffffff;--line:#dce2ee;--ink:#0e1629;--mut:#69768f}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
    font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    background-image:radial-gradient(900px 500px at 50% -10%,rgba(79,124,255,.18),transparent 70%)}
  .card{width:100%;max-width:440px;text-align:center;padding:40px 28px 32px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 24px 60px -24px rgba(0,0,0,.55)}
  .logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:20px;letter-spacing:-.2px}
  .logo img{width:40px;height:40px;border-radius:50%}
  .code{margin:28px 0 6px;font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin:0 0 8px;font-size:20px;font-weight:600}
  p{margin:0 auto 24px;max-width:320px;color:var(--mut);font-size:14.5px;line-height:1.6}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:12px;border:0;text-decoration:none;color:#fff;font-weight:600;font-size:14.5px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 22px -8px rgba(79,124,255,.7)}
  .btn:hover{filter:brightness(1.08)}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  small{display:block;margin-top:18px;color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
  <main class="card">
    <a class="logo" href="/"><img src="/favicon.png" alt="">Dispatch Link</a>
    <div class="code">404</div>
    <h1>This page does not exist</h1>
    <p>The link may be wrong or the page has moved. Go back to Dispatch Link to sign in and continue your work.</p>
    <a class="btn" href="/"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Go to Dispatch Link</a>
    <small id="wait">Taking you there in <b id="sec">5</b> seconds…</small>
  </main>
<script>
  (function () {
    var n = 5, el = document.getElementById('sec');
    var t = setInterval(function () { n--; if (el) el.textContent = n; if (n <= 0) { clearInterval(t); location.replace('/'); } }, 1000);
  })();
</script>
</body>
</html>
